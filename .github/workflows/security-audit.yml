name: Security source audit

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: security-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify safe summary contract
        run: python3 -I -m unittest discover -s scripts/security-ci -p 'test_*.py'
      - name: Scan source without installing application dependencies
        env:
          SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: python3 -E -s scripts/security-ci/run.py
